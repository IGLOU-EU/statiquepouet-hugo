# StatiquePouet Mastodon auto-announce, as a GitHub Actions workflow.
#
# GitHub only runs workflows from `.github/workflows/` at the repo root,
# so copy this file there (e.g. .github/workflows/announce.yml) rather
# than including it in place.
#
# It runs the program on golang:latest, refreshes its dependencies with
# `go mod tidy`, then commits and pushes the front-matter URLs back to
# your repo so StatiquePouet can render the thread on the next build.
#
# Copy it as is (no editing needed) and run it before your Hugo build.
# The announce module lives at themes/statiquepouet-hugo/announce; set
# vars.ANNOUNCE_DIR if you cloned the theme under a different directory name.
#
# Already running a build/deploy workflow? Do not add this as a second
# workflow. Copy just the `announce` job into your existing one and make your
# build job `needs: announce` so a failed announce stops the deploy. See the
# README (Mastodon auto-announce, CI) for the full merge recipe.
#
# Required configuration (Settings, Secrets and variables, Actions):
#   secrets.MASTODON_TOKEN   OAuth2 token, scope write:statuses.
#   vars.MASTODON_INSTANCE   Bare hostname, e.g. mastodon.example.
# The job fails fast if either is unset. Optional:
#   vars.STATUS_VISIBILITY   public / unlisted / private / direct. Default public.
#   vars.STATUS_TEMPLATE     Toot body, tokens %title% and %url%. Default
#                            "New article: %title%\n%url%".
#   vars.ANNOUNCE_DIR        Path to the announce module, relative to the
#                            checkout. Default themes/statiquepouet-hugo/announce.
# SITE_ROOT is set automatically to the checkout, and the push uses the
# built-in GITHUB_TOKEN (no extra token needed; such pushes do not
# retrigger workflows).
#
# To keep the secret and variables in a named GitHub Environment instead of at
# repository level, create the environment (Settings, Environments) and
# uncomment the `environment:` block on the job below. Declaring it is what
# unlocks the environment-scoped vars and secrets.

name: StatiquePouet announce

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    container: golang:latest
    environment:
      name: announce
    env:
      ANNOUNCE_DIR: ${{ vars.ANNOUNCE_DIR }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
      STATUS_VISIBILITY: ${{ vars.STATUS_VISIBILITY }}
      STATUS_TEMPLATE: ${{ vars.STATUS_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check required variables
        run: |
          for v in MASTODON_TOKEN MASTODON_INSTANCE; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "announce: required variable $v is unset"; exit 1; }
          done

      - name: Announce
        env:
          # Pin the Hugo site root to the checkout.
          SITE_ROOT: ${{ github.workspace }}
        run: |
          MODULE_DIR="$SITE_ROOT/${ANNOUNCE_DIR:-themes/statiquepouet-hugo/announce}"
          [ -f "$MODULE_DIR/go.mod" ] || { echo "announce: $MODULE_DIR not found (set vars.ANNOUNCE_DIR if the theme dir is named differently)"; exit 1; }
          echo "announce: using module at $MODULE_DIR"
          cd "$MODULE_DIR"
          go mod tidy
          go run .

      - name: Commit and push front-matter changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "StatiquePouet announce bot"
          if git diff --quiet -- content; then
            echo "announce: no front-matter changes to commit"
          else
            git add content
            git commit -m "chore: announce articles to Mastodon"
            git push
          fi
