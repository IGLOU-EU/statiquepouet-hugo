{{- if .Params.fediverse_context -}}
{{- $cfg := site.Params.statiquepouet | default dict -}}
{{- $basePath := $cfg.basePath | default "https://statiquepouet.gitlab.iglou.eu/" -}}
{{- if not (strings.HasSuffix $basePath "/") -}}{{- $basePath = printf "%s/" $basePath -}}{{- end -}}
<script>
    window.STATIQUE_POUET_CONFIG = {
        commentsContainerId: {{ $cfg.commentsContainerId | default "comments-content" | jsonify | safeJS }},
        lang: {{ $cfg.lang | jsonify | safeJS }},
        basePath: {{ $basePath | jsonify | safeJS }}
    };
    window.statiquePouet = function (action) {
        return (window._sp ||= import(STATIQUE_POUET_CONFIG.basePath + "dist/comments.min.js"))
            .then(function (m) { return m[action](); });
    };
</script>
{{- end -}}
